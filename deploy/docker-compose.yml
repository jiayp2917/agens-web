services:
  agens-web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agens-web
    restart: unless-stopped
    env_file:
      - ./production.env
    expose:
      - "8000"
    volumes:
      - ../runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jiayp_proxy
      - jiayp_internal

# This compose file intentionally does not create PostgreSQL.
# DATABASE_URL must point to the existing internal PostgreSQL service on
# jiayp_internal or another private tunnel/network; never expose PostgreSQL
# to the public internet or LAN for this app.
networks:
  jiayp_proxy:
    external: true
  jiayp_internal:
    external: true
