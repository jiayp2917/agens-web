services:
  agens-web-migrate:
    image: agens-web:${AGENS_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - ./production.env
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/runtime:size=16m,uid=10001,gid=10001,mode=0700
    networks:
      - jiayp_internal

  agens-web:
    image: agens-web:${AGENS_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      agens-web-migrate:
        condition: service_completed_successfully
    env_file:
      - ./production.env
    expose:
      - "8000"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/runtime:size=32m,uid=10001,gid=10001,mode=0700
    pids_limit: ${AGENS_PIDS_LIMIT:-256}
    mem_limit: ${AGENS_MEMORY_LIMIT:-768m}
    cpus: ${AGENS_CPU_LIMIT:-1.0}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jiayp_proxy
      - jiayp_internal

# This compose file intentionally does not create PostgreSQL. The one-shot
# migration service must complete before the application starts.
# DATABASE_URL must point to the existing internal PostgreSQL service on
# jiayp_internal or another private tunnel/network; never expose PostgreSQL
# to the public internet or LAN for this app.
networks:
  jiayp_proxy:
    external: true
  jiayp_internal:
    external: true
