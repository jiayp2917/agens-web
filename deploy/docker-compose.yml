services:
  agens-web-migrate:
    image: agens-web:${AGENS_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - ${AGENS_PRODUCTION_ENV_FILE:-./production.env}
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/runtime:size=16m,uid=10001,gid=10001,mode=0700
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    networks:
      - jiayp_internal

  agens-web:
    image: agens-web:${AGENS_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      agens-web-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    env_file:
      - ${AGENS_PRODUCTION_ENV_FILE:-./production.env}
    expose:
      - "8000"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/runtime:size=32m,uid=10001,gid=10001,mode=0700
    pids_limit: ${AGENS_PIDS_LIMIT:-256}
    mem_limit: ${AGENS_MEMORY_LIMIT:-768m}
    cpus: ${AGENS_CPU_LIMIT:-1.0}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jiayp_proxy
      - jiayp_internal
      - agens_runtime

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agens_runtime

  egress-proxy:
    build:
      context: ./squid
      dockerfile: Dockerfile
    image: agens-web-egress:${AGENS_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${AGENS_PRODUCTION_ENV_FILE:-./production.env}
    expose:
      - "3128"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,uid=100,mode=1777
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agens_runtime
      - agens_egress

# This compose file intentionally does not create PostgreSQL. The one-shot
# migration service must complete before the application starts.
# DATABASE_URL must point to the existing internal PostgreSQL service on
# jiayp_internal or another private tunnel/network; never expose PostgreSQL
# to the public internet or LAN for this app.
networks:
  jiayp_proxy:
    external: true
  jiayp_internal:
    external: true
  agens_runtime:
    internal: true
  agens_egress: {}
