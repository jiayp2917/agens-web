name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agens
          POSTGRES_DB: agens_web
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agens -d agens_web"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://agens@localhost:5432/agens_web
      DATABASE_URL: postgresql+psycopg://agens@localhost:5432/agens_web
      UV_FROZEN: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Upgrade empty database to Alembic head
        run: uv run alembic upgrade head

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests web scripts migrations

      - name: Ruff
        run: uv run ruff check src web tests scripts migrations

      - name: Verify skill compatibility copies
        run: uv run python scripts/verify_skill_copies.py

      - name: Mypy
        run: uv run mypy src web/backend

      - name: Run web DB tests
        run: uv run pytest -q tests/web -n0

      - name: Run Python suite without live LLM calls
        run: uv run pytest -q -m "not llm_real"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend-react
        run: npm ci

      - name: Test frontend
        working-directory: web/frontend-react
        run: npm test

      - name: Build frontend
        working-directory: web/frontend-react
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: web/frontend-react
        run: npm audit --audit-level=high

      - name: Validate Compose and build image
        run: |
          cp deploy/production.env.example deploy/production.env
          docker compose --env-file deploy/production.env -f deploy/docker-compose.yml config
          docker build --tag agens-web:ci .
